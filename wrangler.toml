name = "flogdoog"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 站点同域同步后端（functions/api/sync.js）使用的 KV 命名空间
# 与 worker/sync.js 是同一个命名空间，数据一致
[[kv_namespaces]]
binding = "LP_KV"
id = "f2af754ffe58424688032c7d5a753a26"

# 同步密钥（明文，仅本地部署用；等同 worker/wrangler.toml 中的 SYNC_KEY）
# 注意：该密钥本就随前端 js/sync.js 下发，并非真正的机密
[vars]
SYNC_KEY = "Xzy060112"
