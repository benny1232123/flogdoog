<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F5DE"/><stop offset="1" stop-color="#BFE3C0"/></linearGradient>
  <radialGradient id="body" cx="0.5" cy="0.34" r="0.78"><stop offset="0" stop-color="#92D28D"/><stop offset="1" stop-color="#5DAE64"/></radialGradient>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<!-- 身体 -->
<ellipse cx="200" cy="262" rx="128" ry="132" fill="url(#body)"/>
<!-- 肚皮 -->
<ellipse cx="200" cy="302" rx="78" ry="86" fill="#EFF8E6" opacity="0.92"/>
<!-- 眼睛凸起 -->
<circle cx="150" cy="130" r="50" fill="#6FBF73"/>
<circle cx="250" cy="130" r="50" fill="#6FBF73"/>
<circle cx="150" cy="126" r="32" fill="#FBFDF6"/>
<circle cx="250" cy="126" r="32" fill="#FBFDF6"/>
<circle cx="156" cy="132" r="14" fill="#2C3A2A"/>
<circle cx="244" cy="132" r="14" fill="#2C3A2A"/>
<circle cx="161" cy="127" r="4.5" fill="#fff"/>
<circle cx="249" cy="127" r="4.5" fill="#fff"/>
<!-- 鼻孔 -->
<circle cx="186" cy="212" r="4" fill="#3C6B3A"/>
<circle cx="214" cy="212" r="4" fill="#3C6B3A"/>
<!-- 微笑 -->
<path d="M138 232 q62 56 124 0" fill="none" stroke="#3C6B3A" stroke-width="7" stroke-linecap="round"/>
<!-- 腮红 -->
<circle cx="126" cy="238" r="16" fill="#F4A6B0" opacity="0.5"/>
<circle cx="274" cy="238" r="16" fill="#F4A6B0" opacity="0.5"/>
<!-- 前脚 -->
<ellipse cx="138" cy="372" rx="34" ry="16" fill="#6FBF73"/>
<ellipse cx="262" cy="372" rx="34" ry="16" fill="#6FBF73"/>
<g stroke="#4E8C55" stroke-width="3" stroke-linecap="round" fill="none">
  <path d="M126 372 v11"/><path d="M138 374 v11"/><path d="M150 372 v11"/>
  <path d="M250 372 v11"/><path d="M262 374 v11"/><path d="M274 372 v11"/>
</g>
<rect width="400" height="400" filter="url(#grain)" fill="#fff" opacity="0.5"/>
</svg>
