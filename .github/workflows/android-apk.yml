name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore or generate stable debug keystore
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass flogdoog2026 -keypass flogdoog2026 \
              -alias flogdoog -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Flogdoog Debug, OU=Flogdoog, O=Flogdoog, L=Web, ST=Web, C=CN"
          fi

      - name: Upload keystore (only when newly generated)
        if: hashFiles('android/app/debug.keystore') == ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: android/app/debug.keystore
          if-no-files-found: error

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secret-base-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
